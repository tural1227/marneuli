<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PREMIUM PARK RESIDENCE — Kinematik Dron & Detallı Fasad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --glass-bg: rgba(10, 15, 29, 0.82);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-blur: 24px;
      --accent-cyan: #38bdf8;
      --accent-gold: #f59e0b;
      --accent-blue: #2563eb;
      --accent-emerald: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #02050e;
      color: #f8fafc;
      position: relative;
      touch-action: none;
    }

    /* Video Viewport */
    #viewport-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      cursor: ew-resize;
    }

    .drone-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
      transform-origin: center center;
    }

    #videoDay {
      opacity: 1;
      z-index: 1;
    }

    #videoNight {
      opacity: 0;
      z-index: 2;
    }

    #videoDetailed {
      opacity: 0;
      z-index: 3;
    }

    /* Vignette */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 65%, rgba(2,5,14,0.65) 100%);
      z-index: 5;
    }

    /* Top Left Header & Back */
    .top-left-panel {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-back-main {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.4), rgba(56, 189, 248, 0.6));
      border: 1px solid rgba(56, 189, 248, 0.7);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 16px rgba(56, 189, 248, 0.35);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-back-main:hover {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      transform: translateX(-3px) scale(1.02);
      box-shadow: 0 8px 26px rgba(56, 189, 248, 0.6);
      border-color: #fff;
    }

    .brand-subtle {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      padding: 8px 14px;
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #f8fafc;
      text-transform: uppercase;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .brand-badge.detailed-active {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
    }

    /* Top Center: Day / Night Switch */
    .top-center-bar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }

    .day-night-switch {
      display: flex;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: 40px;
      padding: 4px;
      gap: 4px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      transition: opacity 0.3s ease;
    }

    .switch-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid transparent;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .switch-btn:hover {
      color: #fff;
    }

    .switch-btn.active.day-active {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.35), rgba(234, 88, 12, 0.45));
      border-color: rgba(245, 158, 11, 0.7);
      color: #fef08a;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.45);
    }

    .switch-btn.active.night-active {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.4), rgba(139, 92, 246, 0.5));
      border-color: rgba(56, 189, 248, 0.7);
      color: #7dd3fc;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.45);
    }

    /* RIGHT SIDE VERTICAL ACTION CAPSULE (YUXARI / AŞAĞI DETALLAR) */
    .vertical-explode-dock {
      position: absolute;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      padding: 14px 10px;
      border-radius: 36px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    .vertical-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 64px;
      height: 64px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .vertical-action-btn .btn-icon {
      font-size: 22px;
      transition: transform 0.25s ease;
    }

    .vertical-action-btn .btn-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .vertical-action-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.5);
      color: #fff;
      transform: scale(1.06);
    }

    .vertical-action-btn.btn-unite.active {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.45), rgba(56, 189, 248, 0.65));
      border-color: rgba(56, 189, 248, 0.9);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
    }

    .vertical-action-btn.btn-explode.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.45), rgba(6, 182, 212, 0.65));
      border-color: rgba(16, 185, 129, 0.9);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
    }

    .vertical-action-btn:active {
      transform: scale(0.94);
    }

    .vertical-divider {
      width: 32px;
      height: 2px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 2px;
    }

    /* Interactive Hint */
    .drag-hint-pill {
      position: absolute;
      top: 86px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: pulse-hint 2.2s infinite ease-in-out;
      transition: opacity 0.4s ease;
    }

    @keyframes pulse-hint {
      0%, 100% { opacity: 0.9; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.5; transform: translateX(-50%) scale(0.98); }
    }

    /* Bottom Control Dock */
    .bottom-dock-wrap {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(94vw, 880px);
    }

    .bottom-dock {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: 24px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    .btn-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .btn-circle:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: rgba(56, 189, 248, 0.6);
      transform: scale(1.08);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Explode Toggle in Dock */
    .btn-explode-dock {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.6);
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(6, 182, 212, 0.3));
      color: #6ee7b7;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.25s ease;
    }

    .btn-explode-dock:hover {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.45), rgba(6, 182, 212, 0.5));
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.45);
      color: #fff;
    }

    .btn-explode-dock.unite-mode {
      border-color: rgba(56, 189, 248, 0.7);
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.35), rgba(56, 189, 248, 0.45));
      color: #7dd3fc;
    }

    /* Timeline Scrubber */
    .scrubber-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .scrubber-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
    }

    .scrubber-meta .current-time {
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }

    .slider-track-wrap {
      position: relative;
      width: 100%;
      height: 14px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .video-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.16);
      outline: none;
      cursor: pointer;
      position: relative;
      transition: height 0.15s ease;
    }

    .slider-track-wrap:hover .video-slider {
      height: 8px;
    }

    .video-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6), 0 0 10px rgba(56, 189, 248, 0.8);
      cursor: grab;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .video-slider::-webkit-slider-thumb:hover {
      transform: scale(1.3);
      background: #0284c7;
    }

    .dock-divider {
      width: 1px;
      height: 26px;
      background: rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }

    .speed-btn {
      padding: 5px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .speed-btn:hover, .speed-btn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: rgba(56, 189, 248, 0.6);
      color: #fff;
    }

    @media (max-width: 768px) {
      .top-left-panel {
        top: 14px;
        left: 14px;
      }
      .brand-subtle {
        display: none;
      }
      .top-center-bar {
        top: 14px;
        left: auto;
        right: 14px;
        transform: none;
      }
      .vertical-explode-dock {
        right: 14px;
        padding: 10px 8px;
        border-radius: 28px;
      }
      .vertical-action-btn {
        width: 52px;
        height: 52px;
        border-radius: 18px;
      }
      .vertical-action-btn .btn-icon {
        font-size: 18px;
      }
      .bottom-dock-wrap {
        bottom: 16px;
        width: 96vw;
      }
      .bottom-dock {
        padding: 8px 12px;
        gap: 8px;
      }
      .speed-btn {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Video Viewport -->
  <div id="viewport-container">
    <video id="videoDay" class="drone-video" src="gunduzyeni.mp4" playsinline muted loop autoplay preload="auto"></video>
    <video id="videoNight" class="drone-video" src="geceyeni.mp4" playsinline muted loop preload="auto"></video>
    <video id="videoDetailed" class="drone-video" src="deatlied.mp4" playsinline muted preload="auto"></video>
    <div class="vignette-overlay"></div>
  </div>

  <!-- Interactive Drag / Swipe Hint -->
  <div id="dragHint" class="drag-hint-pill">
    <span>↕️</span>
    <span>Aşağı düymə ilə detallara bölün, yuxarı düymə ilə birləşdirin (və ya ekranı fırladın)</span>
  </div>

  <!-- Top Left: Return to Main 3D System & Brand -->
  <div class="top-left-panel">
    <button class="btn-back-main" onclick="returnToMainSystem()" title="Əsas 3D İnteraktiv Sistemə Qayıt (ESC)">
      <span>⬅️</span>
      <span>3D Sistemə Qayıt</span>
    </button>
    <div class="brand-subtle">
      <span class="brand-title">PREMIUM PARK RESIDENCE</span>
      <span id="viewModeBadge" class="brand-badge">🎬 4K DRON</span>
    </div>
  </div>

  <!-- Top Center: Day / Night Switch -->
  <div class="top-center-bar" id="topCenterBar">
    <div class="day-night-switch">
      <button id="btnDay" class="switch-btn active day-active" onclick="setDayNight('day')" title="Gündüz Dron Baxışı">
        <span>☀️</span>
        <span>Gündüz</span>
      </button>
      <button id="btnNight" class="switch-btn" onclick="setDayNight('night')" title="Gecə Dron Baxışı & Fasad İşıqları">
        <span>🌙</span>
        <span>Gecə</span>
      </button>
    </div>
  </div>

  <!-- RIGHT SIDE VERTICAL ACTION CAPSULE (YUXARI / AŞAĞI) -->
  <div class="vertical-explode-dock" title="Bina Detalları & Mərtəbə Ayrılması">
    <!-- YUXARI DÜYMƏSİ: BİRLƏŞDİR -->
    <button id="btnVerticalUnite" class="vertical-action-btn btn-unite active" onclick="triggerUnite()" title="Yuxarı Düyməsi: Fasadı Birləşdir (↑)">
      <span class="btn-icon">⬆️</span>
      <span class="btn-label">Birləşdir</span>
    </button>

    <div class="vertical-divider"></div>

    <!-- AŞAĞI DÜYMƏSİ: DETALLARA BÖL -->
    <button id="btnVerticalExplode" class="vertical-action-btn btn-explode" onclick="triggerExplode()" title="Aşağı Düyməsi: Detallara Böl (Mərtəbələr) (↓)">
      <span class="btn-icon">⬇️</span>
      <span class="btn-label">Detallar</span>
    </button>
  </div>

  <!-- Bottom Floating Control Dock -->
  <div class="bottom-dock-wrap">
    <div class="bottom-dock">
      <!-- Play / Pause -->
      <button id="btnPlayPause" class="btn-circle" onclick="togglePlayPause()" title="Oynat / Fasilə (Space)">
        <span id="playIcon">⏸</span>
      </button>

      <!-- Detallara Böl / Birləşdir Toggle Button in Dock -->
      <button id="btnDockToggle" class="btn-explode-dock" onclick="toggleDetailedMode()" title="Detallara Böl / Birləşdir">
        <span id="dockToggleIcon">⬇️</span>
        <span id="dockToggleText">Detallara Böl</span>
      </button>

      <!-- Scrubber -->
      <div class="scrubber-container">
        <div class="scrubber-meta">
          <span id="currentTimeText" class="current-time">00:00</span>
          <span id="statusLabel" style="color: #94a3b8; font-size: 11px;">Bütöv Bina Baxışı</span>
          <span id="durationText">00:10</span>
        </div>
        <div class="slider-track-wrap">
          <input type="range" id="videoScrubber" class="video-slider" min="0" max="1000" value="0" step="1" title="Zaman Xətti">
        </div>
      </div>

      <div class="dock-divider"></div>

      <!-- Playback Speed -->
      <button id="btnSpeed" class="speed-btn" onclick="cycleSpeed()" title="Oynatma Sürəti">1.0x</button>

      <!-- Zoom In / Out -->
      <button class="btn-circle" onclick="adjustZoom(0.2)" title="Yaxınlaşdır">➕</button>
      <button class="btn-circle" onclick="adjustZoom(-0.2)" title="Uzaqlaşdır">➖</button>

      <div class="dock-divider"></div>

      <!-- Fullscreen -->
      <button id="btnFullscreen" class="btn-circle" onclick="toggleFullscreen()" title="Tam Ekran (F)">
        <span id="fsIcon">⛶</span>
      </button>
    </div>
  </div>

  <script>
    const videoDay = document.getElementById('videoDay');
    const videoNight = document.getElementById('videoNight');
    const videoDetailed = document.getElementById('videoDetailed');
    const viewport = document.getElementById('viewport-container');

    const btnDay = document.getElementById('btnDay');
    const btnNight = document.getElementById('btnNight');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const playIcon = document.getElementById('playIcon');
    const videoScrubber = document.getElementById('videoScrubber');
    const currentTimeText = document.getElementById('currentTimeText');
    const durationText = document.getElementById('durationText');
    const statusLabel = document.getElementById('statusLabel');
    const btnSpeed = document.getElementById('btnSpeed');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const fsIcon = document.getElementById('fsIcon');
    const dragHint = document.getElementById('dragHint');
    const viewModeBadge = document.getElementById('viewModeBadge');

    const btnVerticalUnite = document.getElementById('btnVerticalUnite');
    const btnVerticalExplode = document.getElementById('btnVerticalExplode');
    const btnDockToggle = document.getElementById('btnDockToggle');
    const dockToggleIcon = document.getElementById('dockToggleIcon');
    const dockToggleText = document.getElementById('dockToggleText');

    let currentDayNight = 'day'; // 'day' or 'night'
    let isDetailedMode = false;  // false = Drone Orbit (whole building), true = Detailed Exploded View (deatlied.mp4)
    let isReversing = false;     // true when playing backwards to unite
    let isPlaying = true;
    let isUserScrubbing = false;
    let currentSpeed = 1.0;
    let currentZoom = 1.0;

    function getActiveVideo() {
      if (isDetailedMode) return videoDetailed;
      return currentDayNight === 'day' ? videoDay : videoNight;
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return "00:00";
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // =========================================================================
    // AŞAĞI DÜYMƏSİ: DETALLARA BÖLÜNSÜN (deatlied.mp4)
    // =========================================================================
    window.triggerExplode = function() {
      if (isReversing) isReversing = false;
      isDetailedMode = true;

      // Update UI state
      btnVerticalExplode.classList.add('active');
      btnVerticalUnite.classList.remove('active');
      btnDockToggle.classList.add('unite-mode');
      dockToggleIcon.textContent = '⬆️';
      dockToggleText.textContent = 'Birləşdir';
      viewModeBadge.textContent = '📐 DETALLAR & MƏRTƏBƏLƏR';
      viewModeBadge.classList.add('detailed-active');
      statusLabel.textContent = 'Mərtəbə və Konstruksiya Detalları';

      // Crossfade to detailed video
      videoDetailed.style.opacity = '1';
      videoDay.style.opacity = '0';
      videoNight.style.opacity = '0';

      // Start playing deatlied.mp4 forward
      if (videoDetailed.currentTime >= videoDetailed.duration - 0.2) {
        videoDetailed.currentTime = 0;
      }
      videoDetailed.playbackRate = currentSpeed;
      videoDetailed.play().catch(() => {});
      isPlaying = true;
      playIcon.textContent = '⏸';

      durationText.textContent = formatTime(videoDetailed.duration || 8.0);
    };

    // =========================================================================
    // YUXARI DÜYMƏSİ: BİRLƏŞSİN (REVERSE SMOOTHLY UNITE BACK)
    // =========================================================================
    window.triggerUnite = function() {
      if (!isDetailedMode) return;

      btnVerticalUnite.classList.add('active');
      btnVerticalExplode.classList.remove('active');
      statusLabel.textContent = 'Fasad Birləşir...';

      // Smooth real-time reverse animation of deatlied.mp4 so the building snaps back together!
      videoDetailed.pause();
      isReversing = true;
      let lastTime = performance.now();

      function reverseStep(now) {
        if (!isReversing) return;
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        // Scrub in reverse at 1.8x speed for crisp, satisfying unification
        videoDetailed.currentTime = Math.max(0, videoDetailed.currentTime - dt * 1.8 * currentSpeed);
        updateProgressUI();

        if (videoDetailed.currentTime <= 0.08) {
          // Finished uniting: return seamlessly to main building orbit!
          videoDetailed.currentTime = 0;
          isReversing = false;
          isDetailedMode = false;

          // Crossfade back to main Day/Night video
          videoDetailed.style.opacity = '0';
          const mainVid = (currentDayNight === 'day' ? videoDay : videoNight);
          mainVid.style.opacity = '1';
          mainVid.play().catch(() => {});
          isPlaying = true;
          playIcon.textContent = '⏸';

          // Reset UI
          btnVerticalUnite.classList.add('active');
          btnVerticalExplode.classList.remove('active');
          btnDockToggle.classList.remove('unite-mode');
          dockToggleIcon.textContent = '⬇️';
          dockToggleText.textContent = 'Detallara Böl';
          viewModeBadge.textContent = '🎬 4K DRON';
          viewModeBadge.classList.remove('detailed-active');
          statusLabel.textContent = 'Bütöv Bina Baxışı';
          durationText.textContent = formatTime(mainVid.duration);
          return;
        }

        requestAnimationFrame(reverseStep);
      }

      requestAnimationFrame(reverseStep);
    };

    // Toggle button in bottom dock
    window.toggleDetailedMode = function() {
      if (isDetailedMode) {
        triggerUnite();
      } else {
        triggerExplode();
      }
    };

    // Day / Night Switcher
    window.setDayNight = function(mode) {
      if (mode === currentDayNight) return;
      currentDayNight = mode;

      if (mode === 'day') {
        btnDay.classList.add('active', 'day-active');
        btnNight.classList.remove('active', 'night-active');
        if (!isDetailedMode) {
          videoDay.style.opacity = '1';
          videoNight.style.opacity = '0';
        }
      } else {
        btnNight.classList.add('active', 'night-active');
        btnDay.classList.remove('active', 'day-active');
        if (!isDetailedMode) {
          videoNight.style.opacity = '1';
          videoDay.style.opacity = '0';
        }
      }

      // Sync playback times between day and night
      if (videoDay.duration && videoNight.duration) {
        const ratio = videoDay.currentTime / videoDay.duration;
        videoNight.currentTime = ratio * videoNight.duration;
      }

      if (isPlaying && !isDetailedMode) {
        videoDay.play().catch(() => {});
        videoNight.play().catch(() => {});
      }
    };

    // Play / Pause
    window.togglePlayPause = function() {
      if (isReversing) isReversing = false;
      isPlaying = !isPlaying;
      const v = getActiveVideo();

      if (isPlaying) {
        v.play().catch(() => {});
        playIcon.textContent = '⏸';
      } else {
        v.pause();
        playIcon.textContent = '▶';
      }
    };

    // Scrubber update
    function updateProgressUI() {
      if (isUserScrubbing) return;
      const v = getActiveVideo();
      if (!v || !v.duration) return;

      const progress = (v.currentTime / v.duration) * 1000;
      videoScrubber.value = Math.round(progress);
      currentTimeText.textContent = formatTime(v.currentTime);
      durationText.textContent = formatTime(v.duration);
    }

    videoDay.addEventListener('timeupdate', updateProgressUI);
    videoNight.addEventListener('timeupdate', updateProgressUI);
    videoDetailed.addEventListener('timeupdate', updateProgressUI);

    videoDay.addEventListener('loadedmetadata', () => {
      if (!isDetailedMode && currentDayNight === 'day') durationText.textContent = formatTime(videoDay.duration);
    });
    videoDetailed.addEventListener('loadedmetadata', () => {
      if (isDetailedMode) durationText.textContent = formatTime(videoDetailed.duration);
    });

    // When detailed video reaches end, pause at full exploded view so user can admire
    videoDetailed.addEventListener('ended', () => {
      if (isDetailedMode && !isReversing) {
        videoDetailed.pause();
        isPlaying = false;
        playIcon.textContent = '▶';
      }
    });

    // Scrubber interaction
    videoScrubber.addEventListener('mousedown', () => { isUserScrubbing = true; if (isReversing) isReversing = false; });
    videoScrubber.addEventListener('touchstart', () => { isUserScrubbing = true; if (isReversing) isReversing = false; }, { passive: true });
    window.addEventListener('mouseup', () => { isUserScrubbing = false; });
    window.addEventListener('touchend', () => { isUserScrubbing = false; });

    videoScrubber.addEventListener('input', (e) => {
      const ratio = parseFloat(e.target.value) / 1000;
      const v = getActiveVideo();
      if (v.duration) {
        v.currentTime = ratio * v.duration;
        currentTimeText.textContent = formatTime(v.currentTime);
      }
    });

    // Speed Cycling
    const speeds = [1.0, 1.5, 2.0, 0.5];
    window.cycleSpeed = function() {
      const idx = speeds.indexOf(currentSpeed);
      currentSpeed = speeds[(idx + 1) % speeds.length];
      videoDay.playbackRate = currentSpeed;
      videoNight.playbackRate = currentSpeed;
      videoDetailed.playbackRate = currentSpeed;
      btnSpeed.textContent = `${currentSpeed}x`;
    };

    // Zoom
    window.adjustZoom = function(delta) {
      currentZoom = Math.min(Math.max(currentZoom + delta, 1.0), 2.2);
      videoDay.style.transform = `scale(${currentZoom.toFixed(2)})`;
      videoNight.style.transform = `scale(${currentZoom.toFixed(2)})`;
      videoDetailed.style.transform = `scale(${currentZoom.toFixed(2)})`;
    };

    // Fullscreen
    window.toggleFullscreen = function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      if (fsIcon) fsIcon.textContent = isFs ? '🗗' : '⛶';
    });

    viewport.addEventListener('dblclick', toggleFullscreen);

    // Interactive Drag Scrubbing (Horizontal) & Vertical Swipe (Down = Explode, Up = Unite)
    let isDragging = false;
    let startX = 0, startY = 0;
    let startTime = 0;

    function onPointerDown(e) {
      isDragging = true;
      startX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX) || 0;
      startY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY) || 0;
      const v = getActiveVideo();
      startTime = v.currentTime || 0;

      if (dragHint) {
        dragHint.style.opacity = '0';
        setTimeout(() => dragHint.remove(), 400);
      }
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX) || 0;
      const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY) || 0;
      const deltaX = clientX - startX;
      const deltaY = clientY - startY;

      const v = getActiveVideo();
      if (!v || !v.duration) return;

      // Horizontal swipe scrubs timeline
      if (Math.abs(deltaX) > Math.abs(deltaY) * 1.2) {
        if (isReversing) isReversing = false;
        const deltaSec = (deltaX / 400) * v.duration;
        let newTime = (startTime + deltaSec) % v.duration;
        if (newTime < 0) newTime += v.duration;
        v.currentTime = newTime;
      }
    }

    function onPointerUp(e) {
      if (isDragging) {
        const clientY = e.clientY !== undefined ? e.clientY : (e.changedTouches && e.changedTouches[0].clientY) || startY;
        const deltaY = clientY - startY;

        // Significant vertical swipe gesture:
        // Swiping DOWN (deltaY > 70px) -> Detallara Böl
        // Swiping UP (deltaY < -70px) -> Birləşdir
        if (deltaY > 70 && !isDetailedMode) {
          triggerExplode();
        } else if (deltaY < -70 && isDetailedMode) {
          triggerUnite();
        }
      }
      isDragging = false;
    }

    viewport.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    viewport.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // Mouse wheel zoom
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      adjustZoom(e.deltaY * -0.001);
    }, { passive: false });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        returnToMainSystem();
        return;
      }
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      }
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        e.preventDefault();
        triggerExplode();
      }
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        e.preventDefault();
        triggerUnite();
      }
      if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
      if (e.key === 'd' || e.key === 'D') {
        setDayNight('day');
      }
      if (e.key === 'n' || e.key === 'N') {
        setDayNight('night');
      }
      if (e.key === 'ArrowLeft') {
        const v = getActiveVideo();
        v.currentTime = Math.max(v.currentTime - 0.5, 0);
      }
      if (e.key === 'ArrowRight') {
        const v = getActiveVideo();
        v.currentTime = Math.min(v.currentTime + 0.5, v.duration);
      }
    });

    // Return to Main 3D System
    window.returnToMainSystem = function() {
      try {
        if (window.parent && window.parent !== window && typeof window.parent.closeCinematicModal === 'function') {
          window.parent.closeCinematicModal();
          return;
        }
      } catch (err) {
        console.warn('Parent access error', err);
      }
      window.location.href = '../index.html';
    };

    // Auto start playback on load
    window.addEventListener('DOMContentLoaded', () => {
      videoDay.play().catch(() => {
        videoDay.muted = true;
        videoDay.play().catch(() => {});
      });
      videoNight.play().catch(() => {
        videoNight.muted = true;
      });
    });
  </script>
</body>
</html>
